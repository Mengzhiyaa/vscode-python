name: 'Smoke tests'
description: 'Run smoke tests'

inputs:
  node_version:
    description: 'Version of Node to install'
    required: true
  artifact_name:
    description: 'Name of the artifact containing the VSIX'
    required: true
  supervisor_path:
    description: 'Path to the vscode-supervisor source directory (relative to repo root)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: 'npm'

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'
        cache-dependency-path: |
          build/test-requirements.txt
          requirements.txt

    - name: Install dependencies (npm ci)
      run: npm ci --prefer-offline
      shell: bash

    - name: Install Python requirements
      uses: brettcannon/pip-secure-install@92f400e3191171c1858cc0e0d9ac6320173fdb0c # v1.0.0
      with:
        options: '-t ./python_files/lib/python --implementation py'

    - name: pip install system test requirements
      run: |
        python -m pip install --upgrade -r build/test-requirements.txt
      shell: bash

    # Bits from the VSIX are reused by smokeTest.ts to speed things up.
    - name: Download VSIX
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}

    - name: Prepare for smoke tests
      run: npx tsc -p ./
      shell: bash

    - name: Set CI_PYTHON_PATH and CI_DISABLE_AUTO_SELECTION
      run: |
        python -c "import sys; print('CI_PYTHON_PATH=' + sys.executable)" >> "$GITHUB_ENV"
        echo "CI_DISABLE_AUTO_SELECTION=1" >> $GITHUB_ENV
      shell: bash

    - name: Run smoke tests
      env:
        DISPLAY: 10
        INSTALL_JUPYTER_EXTENSION: true
        CODE_SUPERVISOR_PATH: ${{ inputs.supervisor_path }}
      uses: GabrielBB/xvfb-action@b706e4e27b14669b486812790492dc50ca16b465 # v1.7
      with:
        run: node --no-force-async-hooks-checks ./out/test/smokeTest.js

    - name: Collect Supervisor and kernel logs
      if: ${{ failure() }}
      shell: python
      run: |
        from pathlib import Path
        import shutil
        import tempfile

        temp_dir = Path(tempfile.gettempdir())
        destination = Path('tmp/smoke-test-logs')
        destination.mkdir(parents=True, exist_ok=True)
        vscode_logs = Path('.vscode-test/user-data/logs')
        if vscode_logs.is_dir():
            shutil.copytree(vscode_logs, destination / 'vscode', dirs_exist_ok=True)
        for pattern in ('kallichore-*.log', 'kernel-*/*.log', 'kernel-*.log'):
            for source in temp_dir.glob(pattern):
                target = destination / source.relative_to(temp_dir)
                target.parent.mkdir(parents=True, exist_ok=True)
                try:
                    shutil.copy2(source, target)
                except OSError as error:
                    print(f'Unable to collect {source}: {error}')

    - name: Upload smoke test failure logs
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: smoke-test-logs-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: warn
        path: |
          tmp/smoke-test-logs/
          test-report.xml
